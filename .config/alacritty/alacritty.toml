[env]
color_prompt = "yes"

[terminal]
osc52 = "CopyPaste"  # enables OSC 52 clipboard we just set up

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 600
blink_timeout = 8
unfocused_hollow = true
thickness = 0.18

[font]
size = 11.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

[keyboard]
bindings = [
   	{ key = "V", mods = "Control|Shift", action = "Paste" },
   	{ key = "C", mods = "Control|Shift", action = "Copy" },
  	{ key = "Return", mods = "Alt", action = "ToggleFullscreen" },
  	{ key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
 ]

[mouse]
hide_when_typing = true

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[[mouse.bindings]]
mouse = "Right"
action = "Copy"

[[mouse.bindings]]
mouse = "Right"
mods = "Control"
action = "Paste"

[[mouse.bindings]]
mouse = "Middle"
action = "Paste"

[[mouse.bindings]]
mouse = "Middle"
mods = "Control"
action = "PasteSelection"

[scrolling]
history = 50000
multiplier = 4

[window]
decorations = "none"
dynamic_padding = true
opacity = 0.96
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
decorations_theme_variant = "Dark"

[window.dimensions]
columns = 120
lines = 32

[window.padding]
x = 12
y = 10

[[hints.enabled]]
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\\s{-}\\^⟨⟩`\\]+'
hyperlinks = true
command = "xdg-open"
post_processing = true
persist = false
mouse = { mods = "Control", enabled = true }
binding = { key = "O", mods = "Control|Shift" }

[[hints.enabled]]
regex = '(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>"\\s{-}\\^⟨⟩`\\]+'
hyperlinks = true
action = "Copy"
post_processing = true
persist = false
binding = { key = "Y", mods = "Control|Shift" }

[general]
import = ["~/.config/alacritty/themes/gruvbox-dark.toml"]
live_config_reload = true
